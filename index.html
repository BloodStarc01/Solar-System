<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Solar System Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-200">
<body class="text-slate-200">

<div id="loading-screen" class="fixed inset-0 z-[100] bg-[#04050b] flex flex-col items-center justify-center">
  <div class="relative w-14 h-14">
    <div class="absolute inset-0 rounded-full border-2 border-slate-800"></div>
    <div class="absolute inset-0 rounded-full border-2 border-t-amber-400 border-transparent animate-spin"></div>
  </div>
  <p class="font-display text-[11px] tracking-[0.3em] text-slate-500 mt-5">Building the solar system</p>
</div>

<div id="canvas-container"></div>

<div id="tooltip" class="glass rounded-lg px-3 py-1.5 text-sm font-display text-slate-100 whitespace-nowrap shadow-xl"></div>

<!-- Top HUD bar -->
<header class="fixed top-0 inset-x-0 z-40 glass holo-panel">
  <div class="flex flex-wrap items-center gap-2.5 sm:gap-3 px-3 sm:px-5 py-2.5 sm:py-3 max-w-[1700px] mx-auto">
    <div class="flex items-center gap-2 mr-auto">
      <span class="text-amber-400 text-xl leading-none">&#9737;</span>
      <div class="leading-tight">
        <h1 class="font-display text-sm sm:text-base tracking-wide text-white">Solar System</h1>
        <p class="hidden sm:block text-[10px] text-slate-500">Interactive explorer</p>
      </div>
      <span id="progress-badge" class="text-[10px] text-slate-500 bg-white/5 border border-white/10 rounded-full px-2 py-0.5"></span>
    </div>

    <div id="explorer-dropdown" class="relative">
      <button id="explorer-btn" class="flex items-center gap-2 text-xs sm:text-sm bg-white/5 hover:bg-white/10 border border-white/10 rounded-full pl-3.5 pr-3 py-2 transition-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span id="explorer-label">Explore bodies</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="explorer-panel" class="hidden fade-in absolute right-0 mt-2 w-64 glass rounded-xl overflow-hidden shadow-2xl">
        <div class="p-2 border-b border-white/10">
          <input id="explorer-search" type="text" placeholder="Search a planet or the Sun..." autocomplete="off"
            class="w-full bg-white/5 rounded-lg px-3 py-2 text-sm outline-none placeholder:text-slate-500 focus:ring-1 focus:ring-amber-400/50" />
        </div>
        <ul id="explorer-list" class="max-h-72 overflow-y-auto text-sm"></ul>
      </div>
    </div>

    <button id="play-pause-btn" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition-colors flex-shrink-0" title="Play or pause">
      <svg id="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      <svg id="icon-play" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <button id="reset-view-header-btn" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition-colors flex-shrink-0" title="Reset view">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>

    <button id="cinematic-btn" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition-colors flex-shrink-0" title="Cinematic view (hide UI)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>

    <div id="more-dropdown" class="relative">
      <button id="more-btn" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition-colors flex-shrink-0" title="More options">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div id="more-panel" class="hidden fade-in absolute right-0 mt-2 w-60 glass holo-panel rounded-xl overflow-hidden shadow-2xl text-sm p-1.5">
        <div class="flex items-center gap-2.5 px-2.5 py-2">
          <span class="text-xs text-slate-400 flex-shrink-0">Speed</span>
          <input id="speed-slider" type="range" min="0.5" max="5" step="0.5" value="1" class="flex-1" />
          <span id="speed-label" class="text-xs font-display text-slate-300 w-8 text-right flex-shrink-0">1.0x</span>
        </div>
        <div class="h-px bg-white/10 my-1"></div>
        <button data-pov="free" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-white/10 transition-colors">Free orbit view</button>
        <button data-pov="top" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-white/10 transition-colors">Top-down view</button>
        <button data-pov="side" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-white/10 transition-colors">Edge-on view</button>
        <div class="h-px bg-white/10 my-1"></div>
        <button id="compare-btn" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-white/10 transition-colors" title="Compare two worlds side by side">Compare worlds</button>
        <button id="meteor-shower-btn" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-white/10 transition-colors" title="Trigger a burst of meteors">Trigger meteor shower</button>
        <button id="screenshot-btn" class="w-full text-left px-2.5 py-2 rounded-lg hover:bg-white/10 transition-colors" title="Capture this view">Save screenshot</button>
        <button id="audio-toggle-btn" class="w-full flex items-center gap-2 text-left px-2.5 py-2 rounded-lg hover:bg-white/10 transition-colors" title="Toggle Harmony of the Spheres (ambient audio)">
          <svg id="icon-audio-off" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          <svg id="icon-audio-on" class="hidden flex-shrink-0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <span>Ambient sound</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Compare modal -->
<div id="compare-modal" class="modal-overlay fixed inset-0 z-[60] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/60" id="compare-backdrop"></div>
  <div class="modal-panel glass holo-panel relative rounded-2xl w-full max-w-lg max-h-[85vh] overflow-y-auto p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-display text-lg text-white">Compare worlds</h2>
      <button id="compare-close" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <select id="compare-a" class="bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-sm text-slate-200"></select>
      <select id="compare-b" class="bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-sm text-slate-200"></select>
    </div>
    <div id="compare-body"></div>
  </div>
</div>

<!-- Hint -->
<p id="hint" class="hidden sm:block fixed left-4 bottom-4 z-30 text-[11px] text-slate-500 glass rounded-full px-3 py-1.5 transition-opacity duration-700">
  Drag to rotate &middot; Scroll to zoom &middot; Click a body to explore &middot; the Sun hides a secret
</p>

<!-- Info drawer -->
<aside id="drawer" class="glass holo-panel fixed z-50 shadow-2xl
  inset-x-0 bottom-0 h-[80vh] rounded-t-3xl translate-y-full
  md:inset-x-auto md:top-0 md:right-0 md:bottom-auto md:h-full md:w-[420px] md:rounded-none md:rounded-l-2xl md:translate-y-0 md:translate-x-full">
  <div class="h-full flex flex-col">
    <div class="flex items-start justify-between px-5 pt-5 pb-4 border-b border-white/10">
      <div class="flex items-center gap-3">
        <span id="drawer-thumb" class="thumb w-12 h-12 rounded-full flex-shrink-0"></span>
        <div>
          <span id="drawer-type" class="inline-block text-[10px] font-display tracking-wide text-amber-300 bg-amber-400/10 border border-amber-400/20 rounded-full px-2.5 py-1"></span>
          <h2 id="drawer-name" class="font-display text-2xl text-white mt-2"></h2>
        </div>
      </div>
      <button id="drawer-close" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center flex-shrink-0" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="drawer-body" class="flex-1 overflow-y-auto px-5 py-5 space-y-6"></div>
    <div class="px-5 py-4 border-t border-white/10">
      <button id="drawer-reset-btn" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-orange-500 hover:opacity-90 text-black font-display text-sm rounded-full py-2.5 transition-opacity">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Return to solar system view
      </button>
    </div>
  </div>
</aside>


<!-- Data first (BODIES), then shared helpers, then app logic. Plain
     scripts (not type="module") so this works via file:// too — they
     share one global scope, loaded in this order. -->
<script src="js/data.js"></script>
<script src="js/textures.js"></script>
<script src="js/controls.js"></script>
<script src="sound/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/scene.js"></script>
</body>
</html>
